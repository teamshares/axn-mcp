inherit_gem:
  axn: .rubocop.yml

# Local deltas only — the AllCops preamble (TargetRubyVersion/NewCops/SuggestExtensions) and the
# shared Style/Metrics body (double_quotes, shorthand hash, trailing commas, disabled
# Documentation/MultilineBlockChain/SingleLineMethods/DoubleNegation/etc., and the Metrics maxes)
# come from axn's shared config above. We own both sides of that coupling: an axn cop change may
# turn this gem's CI red, and we fix it on our own schedule.
#
# Core's shared config also declares `inherit_mode: merge: Exclude`, so RuboCop's built-in
# AllCops/Exclude (vendor/**/*, tmp, .git, node_modules) survives inheritance and resolves against
# THIS repo — covering the top-level vendor/bundle that CI's bundler-cache installs. No need to
# re-declare inherit_mode or a vendor exclude here (and, being pure Ruby, no nested
# spec_rails/dummy_app bundle to exclude either).

# Standard for hyphenated gem names — axn's shared config does not configure Naming/FileName.
Naming/FileName:
  Exclude:
    - "lib/axn-mcp.rb"

# axn's shared config sets Style/StringLiterals (double_quotes) but not the interpolation variant;
# keep this gem on double quotes inside interpolation too.
Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes
